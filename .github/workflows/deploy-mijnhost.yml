name: Deploy SAFe Agile Forge to mijn.host

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy-mijnhost.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeforge-mijnhost-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload website over FTPS
    if: ${{ vars.FORGE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static website files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./deploy/
          cp ./index.html ./deploy/index.html
          if [ -d ./assets ]; then
            cp -R ./assets ./deploy/assets
          fi
          test -s ./deploy/index.html

      - name: Check required FTPS credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          for value in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing GitHub Actions secret: ${value}"
              exit 1
            fi
          done

      - name: Deploy over encrypted FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          # FTP user MUST be restricted to safeforge's own webroot.
          server-dir: ./
          # Never wipe the server's folder; only synchronize Forge's deployed files.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
